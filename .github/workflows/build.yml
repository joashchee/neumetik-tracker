# The app for every platform: macOS, Windows and Linux (Tauri), Android
# and iOS (Tauri mobile), and the web (WebAssembly, published to GitHub
# Pages). Runs on a version tag (v0.1.0) and by hand; a tag also makes a
# GitHub release with the desktop and Android builds attached.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          # Intel Macs, cross-compiled (GitHub's Intel runners are going).
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_target: ""
          - os: ubuntu-22.04
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracker-app
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tracker-app/package-lock.json
      - run: npm ci
        working-directory: tracker-app
      - name: Build
        shell: bash
        working-directory: tracker-app
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then npx tauri build ${{ matrix.args }}; else scripts/build-release.sh ${{ matrix.args }}; fi
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.os }}${{ matrix.rust_target && format('-{0}', matrix.rust_target) || '' }}
          path: |
            tracker-app/target/**/release/bundle/dmg/*.dmg
            tracker-app/target/**/release/bundle/nsis/*.exe
            tracker-app/target/**/release/bundle/msi/*.msi
            tracker-app/target/**/release/bundle/deb/*.deb
            tracker-app/target/**/release/bundle/appimage/*.AppImage
            tracker-app/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # Set these secrets to sign the AAB for the Play Store (the upload
      # key; Play App Signing keeps the app's own key), and
      # PLAY_SERVICE_ACCOUNT_JSON to upload it to Google Play on a tag.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner has the Android SDK already; the NDK is added to it.
      # r28 and later link for 16 KB pages by default, as Google Play
      # requires.
      - name: NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracker-app
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tracker-app/package-lock.json
      - name: Build (an unsigned APK and AAB; the AAB is signed below)
        working-directory: tracker-app
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri android build --ci --apk --aab
      # The 64-bit libraries' segments aligned for 16 KB pages, or the
      # Play Store turns the bundle down.
      - name: 16 KB pages
        working-directory: tracker-app/target
        run: |
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for so in aarch64-linux-android/release/*.so x86_64-linux-android/release/*.so; do
            for align in $("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((align)) -lt 16384 ]; then
                echo "::error::$so: a LOAD segment aligned to $align, not 16 KB"
                exit 1
              fi
            done
            echo "$so: 16 KB"
          done
      # Signed with the upload key (jarsigner signs an AAB as it is).
      - name: Sign the AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: tracker-app/src-tauri/gen/android/app/build/outputs/bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          find . -name '*.aab' | while read -r aab; do
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEY_PASSWORD "$aab" "$ANDROID_KEY_ALIAS"
            jarsigner -verify -strict "$aab"
          done
          rm "$keystore"
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: |
            tracker-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            tracker-app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      # On a version tag, the signed AAB to Google Play: the internal
      # track as a draft unless the PLAY_TRACK and PLAY_RELEASE_STATUS
      # variables say otherwise. The app's first AAB is uploaded by hand
      # in the Play Console; Google Play's API can't create the app.
      - name: The AAB's path
        id: aab
        if: startsWith(github.ref, 'refs/tags/v') && env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "path=$(find tracker-app/src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Upload to Google Play
        if: steps.aab.outputs.path != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ansiapps.neumetiktracker
          releaseFiles: ${{ steps.aab.outputs.path }}
          releaseName: ${{ github.ref_name }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  ios:
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracker-app
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tracker-app/package-lock.json
      # Without a team, the app's code compiled for iPhone and the simulator.
      - name: The app's library for iPhone and the simulator
        working-directory: tracker-app
        run: |
          npm ci
          npm run build
          cargo build --release --lib -p neumetik-tracker-app --target aarch64-apple-ios
          cargo build --release --lib -p neumetik-tracker-app --target aarch64-apple-ios-sim
      # With one (the APPLE_DEVELOPMENT_TEAM secret, and a signing
      # certificate), the Xcode project made and a signed IPA built.
      - name: IPA (signed)
        if: env.APPLE_DEVELOPMENT_TEAM != ''
        working-directory: tracker-app
        run: |
          npx tauri ios init --ci
          npx tauri ios build --ci --export-method app-store-connect
      - uses: actions/upload-artifact@v5
        if: env.APPLE_DEVELOPMENT_TEAM != ''
        with:
          name: ios
          path: tracker-app/src-tauri/gen/apple/build/**/*.ipa

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tracker-app
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tracker-app/package-lock.json
      - name: Build
        working-directory: tracker-app
        env:
          BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tracker-app/dist
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
          generate_release_notes: true
